[package]
name = "shairport-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust-native Shairport Sync rewrite scaffold with built-in PTP, CPAL audio, and flexible mDNS"

[features]
default = []
asio = ["cpal/asio"]
jack = ["cpal/jack"]
ffmpeg = ["ffmpeg-next"]
aac = ["symphonia"]

[dependencies]
aes = "0.8"
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1.10"
cbc = "0.1"
chacha20poly1305 = "0.10"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
cpal = "0.17"
digest = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
ffmpeg-next = { version = "8.1", optional = true }
futures-util = "0.3"
hkdf = "0.12"
mdns-sd = "0.15"
parking_lot = "0.12"
plist = "1.8"
rand = "0.9"
rand_core = "0.6"
ringbuf = "0.4"
rsa = "0.9"
sha1 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha2_011 = { package = "sha2", version = "0.11" }
socket2 = "0.6"
srp = "0.7.0-rc.3"
symphonia = { version = "0.5", optional = true, default-features = false, features = ["aac"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
