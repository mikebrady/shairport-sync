<!-- initial version, based on /etc/dbus-1/system.d/avahi-dbus.conf, with thanks -->
<!DOCTYPE busconfig PUBLIC
          "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only user SYSTEM can own the Shairport Sync service -->
  <policy user="SYSTEM">
    <allow own_prefix="org.gnome.ShairportSync"/>
  </policy>

  <!-- Allow anyone to invoke methods on Shairport Sync server -->
  <!-- (An instance with a D-Bus name tag owns e.g. "org.gnome.ShairportSync.Kitchen", and one
       that finds its name in use adds its process ID, e.g. "org.gnome.ShairportSync.i1234".
       To let anyone invoke methods on such an instance on the system bus, add a policy file
       with e.g. <allow send_destination="org.gnome.ShairportSync.Kitchen"/>. A send_path
       rule without a send_destination would allow method calls to any service on the bus
       that has an object at that path, and send_destination_prefix is not supported by
       dbus-broker.) -->
  <policy context="default">
    <allow send_destination="org.gnome.ShairportSync"/>
    <allow receive_sender="org.gnome.ShairportSync"/>
  </policy>

</busconfig>
