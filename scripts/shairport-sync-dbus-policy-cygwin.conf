<!-- initial version, based on /etc/dbus-1/system.d/avahi-dbus.conf, with thanks -->
<!DOCTYPE busconfig PUBLIC
          "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only user SYSTEM can own the Shairport Sync service -->
  <policy user="SYSTEM">
    <allow own_prefix="org.gnome.ShairportSync"/>
  </policy>

  <!-- Allow anyone to invoke methods on Shairport Sync server -->
  <!-- (An instance that finds "org.gnome.ShairportSync" in use by another instance takes a
       name made from its own name instead, e.g. "org.gnome.ShairportSync.Kitchen";
       send_path lets methods reach that, too.) -->
  <policy context="default">
    <allow send_destination="org.gnome.ShairportSync"/>
    <allow send_path="/org/gnome/ShairportSync"/>
    <allow receive_sender="org.gnome.ShairportSync"/>
  </policy>

</busconfig>
